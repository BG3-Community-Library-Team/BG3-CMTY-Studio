name: 'Setup Tauri Dependencies'
description: 'Install platform-specific system dependencies for Tauri 2'
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # gnome-keyring provides a Secret Service for the credential tests (see scripts/ci/test-rust.sh)
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf gnome-keyring
      shell: bash
