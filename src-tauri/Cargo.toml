[package]
name = "bg3-cmty-studio"
default-run = "bg3-cmty-studio"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[features]
default = ["git-integration", "nexus-integration", "modio-integration"]
git-integration = ["dep:git2"]
nexus-integration = []
modio-integration = []
platform-api = ["nexus-integration", "modio-integration"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.39"
regex = "1"
flate2 = "1"
lz4_flex = "0.13"
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
crossbeam-channel = "0.5"
rmp-serde = "1"
walkdir = "2"
rayon = "1.10"
dirs = "6"
chrono = "0.4"
md-5 = "0.11"
digest = "0.11"
serde-saphyr = "0.0.23"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
git2 = { version = "0.20", features = ["vendored-libgit2"], optional = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
sha2 = "0.10"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Identifies the Secret Service provider; already pulled in by keyring's sync-secret-service.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[dev-dependencies]
dotenvy = "0.15"
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
ts-rs = { version = "12", features = ["serde-compat"] }
criterion = { version = "0.8", features = ["html_reports"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "bg3_cmty_studio_lib"
# Desktop only: staticlib/cdylib are only needed for Tauri mobile targets.
crate-type = ["rlib"]

[[bench]]
name = "staging"
harness = false

# Thin LTO optimizes across crates in parallel on all cores; full LTO ("fat",
# codegen-units = 1) runs its final optimization pass on essentially one core.
[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

# Keep full debug info for this crate only; dependencies aren't debugged here,
# and their debug info made target/debug tens of GB and slowed linking.
[profile.dev.package."*"]
debug = false
